name: Build experimental RetroArch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-retroarch-experimental.yml"
      - "experimental/retroarch-version.txt"
  workflow_dispatch:
    inputs:
      version:
        description: RetroArch version without leading v
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-arm64-bullseye:
    name: ARM64 Bullseye / Pi 4
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bullseye

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Bullseye has moved to archive.debian.org. Keep this frozen userspace
          # deliberately so the binary stays compatible with OS4 Final 27.
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99bullseye-archive

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            pkg-config \
            libasound2-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfreetype6-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libxkbcommon-dev \
            zlib1g-dev
          rm -rf /var/lib/apt/lists/*

      - name: Check out updater repository
        uses: actions/checkout@v4

      - name: Resolve RetroArch version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(tr -d '[:space:]' < experimental/retroarch-version.txt)"
            version="${version#v}"
          fi

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid RetroArch version: $version" >&2
            exit 1
          }

          echo "RA_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building RetroArch $version"

      - name: Fetch RetroArch source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${RA_VERSION}" \
            https://github.com/libretro/RetroArch.git /work/RetroArch

      - name: Configure Pi 4 KMS / EGL / GLES build
        shell: bash
        working-directory: /work/RetroArch
        run: |
          set -euo pipefail
          export CFLAGS="-O2 -pipe -mcpu=cortex-a72"
          export CXXFLAGS="$CFLAGS"

          ./configure \
            --disable-videocore \
            --disable-opengl1 \
            --disable-x11 \
            --disable-wayland \
            --disable-vulkan \
            --disable-pulse \
            --disable-oss \
            --enable-opengles \
            --enable-opengles3 \
            --enable-opengles3_1 \
            --enable-kms \
            --enable-egl \
            --enable-alsa \
            --enable-udev

      - name: Build
        shell: bash
        working-directory: /work/RetroArch
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /work/package/retroarch
          install -m 0755 /work/RetroArch/retroarch /work/package/retroarch/retroarch

          /work/RetroArch/retroarch --features > /work/package/FEATURES.txt || true
          ldd /work/RetroArch/retroarch > /work/package/LDD.txt || true
          readelf --version-info /work/RetroArch/retroarch > /work/package/VERSION-INFO.txt || true

          cat > /work/package/BUILDINFO.txt <<EOF
          RetroArch=${RA_VERSION}
          Target=RGB-Pi OS4 Final 27 experimental
          Architecture=aarch64
          BuildUserspace=Debian Bullseye archive
          CPU=cortex-a72
          Video=KMS+EGL+OpenGL ES
          Audio=ALSA
          Input=udev
          Vulkan=disabled
          X11=disabled
          Wayland=disabled
          Status=EXPERIMENTAL_NOT_CRT_VALIDATED
          Commit=${GITHUB_SHA}
          EOF

          cd /work/package
          tar -czf "/work/retroarch-rgbpi-${RA_VERSION}-experimental.tar.gz" .
          sha256sum "/work/retroarch-rgbpi-${RA_VERSION}-experimental.tar.gz" \
            > "/work/retroarch-rgbpi-${RA_VERSION}-experimental.tar.gz.sha256"
          sha256sum /work/package/retroarch/retroarch \
            > "/work/retroarch-${RA_VERSION}-binary.sha256"

      - name: Upload experimental artifact
        uses: actions/upload-artifact@v4
        with:
          name: retroarch-rgbpi-experimental
          path: |
            /work/retroarch-rgbpi-*-experimental.tar.gz
            /work/retroarch-rgbpi-*-experimental.tar.gz.sha256
            /work/retroarch-*-binary.sha256
            /work/package/BUILDINFO.txt
            /work/package/FEATURES.txt
            /work/package/LDD.txt
            /work/package/VERSION-INFO.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish experimental prerelease
    needs: build-arm64-bullseye
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: retroarch-rgbpi-experimental
          path: dist

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^RetroArch=//p' dist/BUILDINFO.txt | head -n1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Could not resolve RetroArch version" >&2
            exit 1
          }

          echo "RA_VERSION=$version" >> "$GITHUB_ENV"
          echo "RA_TAG=retroarch-${version}-experimental" >> "$GITHUB_ENV"

          cat > release-notes.md <<EOF
          Experimental RetroArch ${version} build for RGB-Pi OS4 Final 27 on Raspberry Pi 4 / Pi 400.

          This is a Bullseye/aarch64 Cortex-A72 build using KMS + EGL + OpenGL ES, ALSA and udev.

          **This build has not yet passed real 15-kHz CRT validation and is intentionally not used by the stable updater manifest.**

          Test with a full SD-card backup and validate 240p/288p, PAL 50 Hz, NTSC refresh, mode switching, audio, controller reconnect, and return-to-menu behavior before promotion.

          Build commit: ${GITHUB_SHA}
          EOF

      - name: Create or refresh prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "dist/retroarch-rgbpi-${RA_VERSION}-experimental.tar.gz"
            "dist/retroarch-rgbpi-${RA_VERSION}-experimental.tar.gz.sha256"
            "dist/retroarch-${RA_VERSION}-binary.sha256"
            "dist/BUILDINFO.txt"
            "dist/FEATURES.txt"
            "dist/LDD.txt"
            "dist/VERSION-INFO.txt"
          )

          if gh release view "$RA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RA_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RA_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RetroArch ${RA_VERSION} experimental for RGB-Pi OS4 Final 27" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RA_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RetroArch ${RA_VERSION} experimental for RGB-Pi OS4 Final 27" \
              --notes-file release-notes.md \
              --prerelease
          fi
