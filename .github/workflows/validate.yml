name: Validate updater

on:
  push:
    branches:
      - main
      - modernize-2026
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n update.sh
          bash -n install.sh
          for script in data/*.sh; do
            bash -n "$script"
          done

      - name: Validate Python syntax
        run: python3 -m py_compile data/*.py tests/*.py

      - name: Test OS4 Ports installer and privilege dispatch
        run: python3 tests/test_installation.py

      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json >/dev/null

      - name: Verify release assets referenced by manifest
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          pattern = re.compile(
              r"^https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^/?#]+)$"
          )
          release_cache = {}

          def fetch_release(owner, repo, tag):
              key = (owner, repo, tag)
              if key in release_cache:
                  return release_cache[key]
              encoded = urllib.parse.quote(tag, safe="")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/releases/tags/{encoded}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "rgbpi27-manifest-validator",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  release = json.load(response)
              release_cache[key] = release
              return release

          for key, item in manifest["assets"].items():
              url = item["url"]
              match = pattern.match(url)
              if not match:
                  raise SystemExit(f"{key}: unsupported stable asset URL: {url}")

              owner, repo, tag, filename = match.groups()
              release = fetch_release(owner, repo, tag)
              assets = {asset["name"]: asset for asset in release.get("assets", [])}
              asset = assets.get(filename)
              if not asset:
                  raise SystemExit(f"{key}: asset {filename!r} missing from {owner}/{repo}@{tag}")
              if asset.get("state") != "uploaded" or int(asset.get("size", 0)) <= 0:
                  raise SystemExit(f"{key}: asset is not a complete uploaded file")
              if asset.get("browser_download_url") != url:
                  raise SystemExit(
                      f"{key}: manifest URL differs from GitHub browser_download_url"
                  )

              digest = asset.get("digest") or ""
              expected = f"sha256:{item['sha256']}"
              if digest and digest.lower() != expected.lower():
                  raise SystemExit(
                      f"{key}: GitHub release digest mismatch: {digest} != {expected}"
                  )

              print(
                  f"OK {key}: {owner}/{repo}@{tag}/{filename} "
                  f"size={asset['size']} digest={digest or 'not-reported'}"
              )

      - name: Validate manifest schema
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] >= 2
          assert manifest["channel"] in {"stable", "preview", "latest"}

          required = {"retroarch", "cores", "timings"}
          assets = manifest["assets"]
          missing = required - assets.keys()
          assert not missing, f"missing assets: {sorted(missing)}"

          for name in sorted(required):
              asset = assets[name]
              assert asset.get("version"), f"{name}: missing version"
              assert asset.get("filename"), f"{name}: missing filename"
              assert asset.get("url"), f"{name}: missing URL"
              digest = asset.get("sha256", "")
              assert len(digest) == 64, f"{name}: invalid sha256"
